name: Build Custom Spider JAR

on:
  # 當推送到 main 分支時自動觸發
  push:
    branches: [ "main" ]
  # 允許在 GitHub Actions 頁面手動點擊按鈕觸發
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 設定 JDK 17 環境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 賦予 Gradlew 執行權限
        run: chmod +x gradlew

      - name: 4. 編譯 Release 版本並提取 dex 打包成 JAR
        run: |
          # 1. 使用 Gradle 編譯經過 R8 壓縮與極小化的 Release APK
          ./gradlew assembleRelease
          
          # 2. 找到編譯出來的 APK 檔案並使用專案內建的 apktool 解開提取 dex，或直接轉封裝為 jar
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          
          # 使用專案內的 apktool 解包 (比照專案內建 build.bat 邏輯)
          java -jar jar/3rd/apktool_2.11.0.jar d -f -s "$APK_PATH" -o app/build/apktool_out
          
          # 將解出來的 classes.dex 重新打包成 custom_spider.jar並計算 MD5
          mkdir -p output
          cd app/build/apktool_out
          jar cvf ../../../output/custom_spider.jar classes*.dex
          cd ../../../
          md5sum output/custom_spider.jar | awk '{print $1}' > output/custom_spider.jar.md5

      - name: 5. 上傳打包好的 JAR 檔案 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider
          path: |
            output/custom_spider.jar
            output/custom_spider.jar.md5
